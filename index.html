<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Open Sans",Arial,sans-serif;color:#1d1d1d;background:#fff;line-height:1.6}
a{color:#8E00BA}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid #eee}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;gap:12px}
.marque{font-weight:700;color:#4E0066;text-decoration:none;font-size:1.05rem}
.marque span{color:#8E00BA}
.fil{font-size:.85rem;color:#666}
.hero{background:#EED9F5;padding:40px 0}
.kick{text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;font-weight:700;color:#8E00BA}
h1{font-size:2.1rem;line-height:1.2;margin:.3rem 0 .8rem;color:#4E0066}
h2{font-size:1.35rem;color:#4E0066;margin:2rem 0 .6rem}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:start}
.apercu{-webkit-mask-image:linear-gradient(#000 45%,transparent 92%);mask-image:linear-gradient(#000 45%,transparent 92%);width:100%;border-radius:10px;box-shadow:0 6px 24px rgba(78,0,102,.18);display:block}
.btn{display:inline-block;background:#8E00BA;color:#fff;text-decoration:none;font-weight:700;padding:15px 26px;border-radius:12px;font-size:1.05rem}
.btn:hover{background:#4E0066}
.btn2{display:inline-block;border:2px solid #8E00BA;color:#8E00BA;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:12px}
.petit{font-size:.85rem;color:#555}
ul.notions{padding-left:1.2rem} ul.notions li{margin:.25rem 0}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin:24px 0 40px}
.carte{border:1px solid #E8CCF1;border-radius:14px;padding:18px;text-decoration:none;color:inherit;display:block}
.carte:hover{border-color:#8E00BA}
.carte b{color:#4E0066;display:block;font-size:1.1rem;margin:.2rem 0}
.cinq{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 0;padding:0;list-style:none}
.cinq li{background:#faf5fc;border-radius:10px;padding:10px;font-size:.9rem;text-align:center}
.pub{margin:28px auto;min-height:0}
footer{border-top:1px solid #eee;margin-top:48px;padding:20px 0;font-size:.85rem;color:#666}
@media (max-width:720px){.grid{grid-template-columns:1fr} h1{font-size:1.6rem} .cinq{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><div class="wrap"><a class="marque" href="/crpe/">@la_prof_julie <span>fiches CRPE</span></a>
